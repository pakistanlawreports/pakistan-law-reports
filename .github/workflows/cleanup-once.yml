name: Cleanup broken highlights (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cleanup_bad_highlights.py
      - name: Commit
        run: |
          git config user.name "PLR Auto-Update Bot"
          git config user.email "actions@github.com"
          git add data/case_highlights.json
          git commit -m "Remove broken non-judgment highlight entries"
          git push
