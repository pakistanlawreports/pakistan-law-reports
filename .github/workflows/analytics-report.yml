name: Generate analytics report

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-analytics-data google-auth

      - name: Generate analytics report
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python analytics_report.py

      - name: Commit changes (if any)
        run: |
          git config user.name "PLR Auto-Update Bot"
          git config user.email "actions@github.com"
          git add data/analytics_report.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update analytics report"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected - pulling latest changes and retrying..."
            git pull --rebase --strategy-option=ours
            sleep 5
          done
          echo "Failed to push after 3 attempts."
          exit 1
