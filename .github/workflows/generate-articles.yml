name: Generate scenario articles

on:
  schedule:
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_articles.py

      - name: Commit new articles (if any)
        if: always()
        run: |
          git config user.name "PLR Auto-Update Bot"
          git config user.email "actions@github.com"
          git add data/articles.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-generate scenario articles"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --strategy-option=ours
            sleep 5
          done
          exit 1
